    function showError(msg) {
    document.getElementById('map').innerHTML =
      '<div style="color:#e8f4fd;font-family:Georgia,serif;font-size:16px;text-align:center;padding:40px;">' + msg + '</div>';
  }
 
  function initMap() {
    var params = new URLSearchParams(window.location.search);
    var districtNum = parseInt(params.get('district') || Object.keys(DISTRICTS)[0], 10);
 
    document.getElementById('dlabel').textContent = districtNum;
 
    var coords = DISTRICTS[districtNum];
    if (!coords || coords.length === 0) {
      showError('No coordinates loaded for District ' + districtNum + '.');
      return;
    }
 
    var map = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      scrollWheelZoom: true,
      dragging: true,
      doubleClickZoom: false
    }).setView([32.5, -83.5], 7);
 
    // Light tile layer with street and city labels
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);
 
    // Show real lat/lng on hover
    map.on('mousemove', function(e) {
      document.getElementById('coord-display').textContent =
        'lat: ' + e.latlng.lat.toFixed(5) + '   lng: ' + e.latlng.lng.toFixed(5);
    });
 
    // Convert pixel coords to real lat/lng
    var latlngs = coords.map(function(pt) { return toLatLng(pt[0], pt[1]); });
 
    var polygon = L.polygon(latlngs, {
      color: '#378add',
      weight: 2,
      opacity: 1,
      fillColor: '#378add',
      fillOpacity: 0.35
    }).addTo(map);
 
    polygon.on('mouseover', function() { polygon.setStyle({ fillOpacity: 0.55 }); });
    polygon.on('mouseout',  function() { polygon.setStyle({ fillOpacity: 0.35 }); });
 
    map.fitBounds(polygon.getBounds(), { padding: [40, 40] });
  }
 
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  s.onload = initMap;
  s.onerror = function() { showError('Failed to load map library.'); };
  document.head.appendChild(s);
</script>
